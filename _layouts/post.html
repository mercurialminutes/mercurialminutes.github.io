<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{{ page.title }} — Karin Valis</title>
  <meta name="description" content="{{ page.title }} — Karin Valis / Mercurial Minutes" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=IBM+Plex+Mono:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}" />
</head>
<body class="is-essay">
  <canvas id="shader-bg" aria-hidden="true"></canvas>
  <div class="grain" aria-hidden="true"></div>

  <main class="essay-stage">
    <article class="essay">
      <a class="essay-back" href="{{ '/' | relative_url }}">← Mercurial Minutes</a>
      <h1 class="chrome-text">{{ page.title }}</h1>
      {% if page.author %}<p class="tagline">{{ page.author }}</p>{% endif %}
      <div class="essay-body">
        {{ content }}
      </div>
    </article>
  </main>

  <canvas id="shader-overlay" aria-hidden="true"></canvas>
  <script src="{{ '/assets/js/shader-bg.js' | relative_url }}"></script>
</body>
</html>
